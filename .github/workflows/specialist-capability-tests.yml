name: Specialist Capability Tests

on:
  push:
    branches:
      - main
      - feat/open-source-agent-learning-roadmap
      - feat/office-orchestrator-all-options
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        with:
          python-version: "3.12"
        uses: actions/setup-python@v5
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
