name: Data Labeling Earnings Hunter

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/**'
      - 'portfolio/**'
      - 'docs/DATA_LABELING_ENGINE.md'
      - 'docs/DIRECT_CLIENT_MICROGIG_EXPERIMENT.md'
      - '.github/workflows/data-labeling-hunter.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: data-labeling-hunter-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic portfolio sample
        run: python agents/annotation_quality_check.py --input portfolio/synthetic_customer_feedback_labeled.csv --report output/annotation-qa-report.json
      - name: Scan official public listings
        run: python agents/data_labeling_hunter.py --output-dir output
      - name: Upload CSV and JSON lead report
        uses: actions/upload-artifact@v7
        with:
          name: data-labeling-leads
          path: output/
          retention-days: 14
