name: Agent Runtime Tests
on:
  push:
    paths:
      - 'runtime/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/agent-runtime-tests.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/agent-runtime-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run all Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run harmless demo task
        run: python runtime/runner.py
