name: Public portal tests

on:
  pull_request:
    paths:
      - "public-portal/**"
      - ".github/workflows/public-portal-tests.yml"
  push:
    branches:
      - main
      - "feat/public-agent-chat-portal"
    paths:
      - "public-portal/**"
      - ".github/workflows/public-portal-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install portal dependencies
        run: python -m pip install -r public-portal/requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: public-portal
        run: python -m unittest discover -s public-portal -v
