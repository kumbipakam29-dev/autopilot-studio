name: Agent registry validation
on:
  push:
    branches: [main, feat/public-agent-chat-portal]
    paths:
      - 'agents/**'
      - 'scripts/validate_agent_registry.py'
      - 'tests/test_agent_registry.py'
      - '.github/workflows/agent-registry-validation.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'scripts/validate_agent_registry.py'
      - 'tests/test_agent_registry.py'
      - '.github/workflows/agent-registry-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate registry
        run: python scripts/validate_agent_registry.py
      - name: Run registry tests
        run: python -m unittest discover -s tests -p 'test_agent_registry.py'
